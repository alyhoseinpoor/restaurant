openapi: 3.0.3
info:
  title: Restaurant API
  version: 1.0.0
  description: |-
    REST API for a restaurant: menu, cart, checkout, orders, comments and favorites.

    ## Try it in 4 steps
    1. **Auth → Register** to create an account.
    2. **Auth → Log in** and copy the `access` token from the response.
    3. Click **Authorize** (top right) and paste the token. Swagger adds `Bearer` for you.
    4. Follow the flow: **Menu → List foods**, **Cart → Add a food to the cart**, **Cart → Checkout**, **Orders → List my orders**.

    List endpoints are paginated (10 per page, use `?page=2`). A Postman collection with the same flow is in the repository (`docs/`).
  contact:
    name: Source code on GitHub
    url: https://github.com/alyhoseinpoor/restaurant
paths:
  /api/cart/:
    get:
      operationId: cart_retrieve
      description: The open cart of the logged-in user with its items and the server-side
        total. It is created automatically on first use.
      summary: View my cart
      tags:
      - Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
    delete:
      operationId: cart_destroy
      description: Remove all items from the cart.
      summary: Empty the cart
      tags:
      - Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/cart/checkout/:
    post:
      operationId: cart_checkout_create
      description: Turns the cart into an order with status `placed`. Items are re-priced
        at the current menu price inside a database transaction.
      summary: 'Checkout: place the order'
      tags:
      - Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          description: The cart is empty, or a food is no longer available.
  /api/cart/items/:
    post:
      operationId: cart_items_create
      description: Adds the food with the current menu price. If the food is already
        in the cart its quantity increases (200 instead of 201). Quantity must be
        between 1 and 50.
      summary: Add a food to the cart
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItem'
            examples:
              TwoPortions:
                value:
                  food: 1
                  quantity: 2
                summary: Two portions
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderItem'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
          description: The food was already in the cart; its quantity was increased.
        '400':
          description: Invalid quantity, or the food is unavailable.
  /api/cart/items/{id}/:
    patch:
      operationId: cart_items_partial_update
      description: Only items of your own open cart can be changed (others return
        404).
      summary: Change the quantity of a cart item
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order item.
        required: true
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderItem'
            examples:
              NewQuantity:
                value:
                  quantity: 3
                summary: New quantity
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderItem'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
          description: ''
    delete:
      operationId: cart_items_destroy
      description: Only items of your own open cart can be removed.
      summary: Remove an item from the cart
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order item.
        required: true
      tags:
      - Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/categories/:
    get:
      operationId: categories_list
      description: Public. Paginated (10 per page, `?page=2`).
      summary: List categories
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Menu
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: categories_create
      description: Staff only.
      summary: Create a category
      tags:
      - Menu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      description: Public.
      summary: Category detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - Menu
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: categories_update
      description: Staff only.
      summary: Replace a category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - Menu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      description: Staff only.
      summary: Update a category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - Menu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      description: Staff only. Returns 400 while the category still has foods.
      summary: Delete a category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - Menu
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/comments/:
    get:
      operationId: comments_list
      description: Public. Only comments approved by an admin are returned. Use `?food=<id>`
        to get the comments of one food.
      summary: List approved comments
      parameters:
      - in: query
        name: food
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Comments
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommentList'
          description: ''
    post:
      operationId: comments_create
      description: 'Requires login. The comment stays hidden (`active: false`) until
        an admin approves it.'
      summary: Create a comment
      tags:
      - Comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Comment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
  /api/favorites/:
    get:
      operationId: favorites_list
      description: Only the favorites of the logged-in user.
      summary: List my favorites
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Favorites
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFavoriteList'
          description: ''
    post:
      operationId: favorites_create
      description: Returns 400 if the food is already in your favorites.
      summary: Add a favorite
      tags:
      - Favorites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Favorite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Favorite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Favorite'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
          description: ''
  /api/favorites/{id}/:
    delete:
      operationId: favorites_destroy
      description: Only your own favorites can be removed (others return 404).
      summary: Remove a favorite
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this favorite.
        required: true
      tags:
      - Favorites
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/foods/:
    get:
      operationId: foods_list
      description: Public and paginated. Filter by `category` (slug), `available`,
        `min_price`, `max_price`; search in title and description with `search`; sort
        with `ordering` (`price`, `-price`, `title`).
      summary: List foods
      parameters:
      - in: query
        name: available
        schema:
          type: boolean
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: max_price
        schema:
          type: integer
      - in: query
        name: min_price
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Menu
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFoodList'
          description: ''
    post:
      operationId: foods_create
      description: Staff only. The slug is generated from the title when omitted.
      summary: Create a food
      tags:
      - Menu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Food'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Food'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Food'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
          description: ''
  /api/foods/{id}/:
    get:
      operationId: foods_retrieve
      description: Public.
      summary: Food detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this food.
        required: true
      tags:
      - Menu
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
          description: ''
    put:
      operationId: foods_update
      description: Staff only.
      summary: Replace a food
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this food.
        required: true
      tags:
      - Menu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Food'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Food'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Food'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
          description: ''
    patch:
      operationId: foods_partial_update
      description: Staff only.
      summary: Update a food
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this food.
        required: true
      tags:
      - Menu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFood'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFood'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFood'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
          description: ''
    delete:
      operationId: foods_destroy
      description: 'Staff only. Returns 400 if the food was ordered before; mark it
        `available: false` instead.'
      summary: Delete a food
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this food.
        required: true
      tags:
      - Menu
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/orders/:
    get:
      operationId: orders_list
      description: Order history of the logged-in user. The open cart is not included.
      summary: List my orders
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
  /api/orders/{id}/:
    get:
      operationId: orders_retrieve
      description: Only your own orders (others return 404).
      summary: Order detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/{id}/cancel/:
    post:
      operationId: orders_cancel_create
      description: Only orders in the `placed` state can be cancelled.
      summary: Cancel an order
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          description: The order is no longer in the "placed" state.
  /api/register/:
    post:
      operationId: register_create
      description: Create a new account. Afterwards call **Log in** to get a token.
      summary: Register
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              NewUser:
                value:
                  username: ali
                  email: ali@example.com
                  password: Str0ng-Pass!word
                summary: New user
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
        '400':
          description: 'Validation error: weak password or username already taken.'
  /api/token/:
    post:
      operationId: token_create
      description: 'Returns a short-lived `access` token (60 minutes) and a `refresh`
        token (1 day). Send the access token as `Authorization: Bearer <access>`;
        in Swagger UI click **Authorize** and paste it.'
      summary: Log in (get JWT tokens)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
            examples:
              Credentials:
                value:
                  username: ali
                  password: Str0ng-Pass!word
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: Exchange a valid `refresh` token for a new `access` token.
      summary: Refresh the access token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          pattern: ^[-\w]+$
          maxLength: 50
        img:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - name
      - slug
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        food:
          type: integer
        username:
          type: string
          readOnly: true
        text:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        active:
          type: boolean
          readOnly: true
      required:
      - active
      - created_at
      - food
      - id
      - text
      - username
    Favorite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        food:
          type: integer
      required:
      - food
      - id
    Food:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        desc:
          type: string
        price:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        category:
          type: integer
        img:
          type: string
          format: uri
          nullable: true
        available:
          type: boolean
          default: true
        slug:
          oneOf:
          - type: string
            pattern: ^[-\w]+$
            maxLength: 80
          - type: string
            maxLength: 0
      required:
      - category
      - desc
      - id
      - price
      - title
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        total:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        placed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - items
      - placed_at
      - status
      - total
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        food:
          type: integer
        food_title:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 50
          minimum: 1
          default: 1
        unit_price:
          type: integer
          readOnly: true
        subtotal:
          type: integer
          readOnly: true
      required:
      - food
      - food_title
      - id
      - subtotal
      - unit_price
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedCommentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    PaginatedFavoriteList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Favorite'
    PaginatedFoodList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Food'
    PaginatedOrderList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    PatchedCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          pattern: ^[-\w]+$
          maxLength: 50
        img:
          type: string
          format: uri
          nullable: true
    PatchedFood:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        desc:
          type: string
        price:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        category:
          type: integer
        img:
          type: string
          format: uri
          nullable: true
        available:
          type: boolean
          default: true
        slug:
          oneOf:
          - type: string
            pattern: ^[-\w]+$
            maxLength: 80
          - type: string
            maxLength: 0
    PatchedOrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        food:
          type: integer
        food_title:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 50
          minimum: 1
          default: 1
        unit_price:
          type: integer
          readOnly: true
        subtotal:
          type: integer
          readOnly: true
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
      required:
      - id
      - password
      - username
    StatusEnum:
      enum:
      - cart
      - placed
      - preparing
      - delivered
      - cancelled
      type: string
      description: |-
        * `cart` - Cart
        * `placed` - Placed
        * `preparing` - Preparing
        * `delivered` - Delivered
        * `cancelled` - Cancelled
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: http://localhost:8000
  description: Local development
tags:
- name: Auth
  description: Register and get JWT tokens.
- name: Menu
  description: Categories and foods. Public to read, staff only to change.
- name: Cart
  description: The logged-in user's cart and checkout.
- name: Orders
  description: Order history and cancellation.
- name: Comments
  description: Food comments. New comments wait for admin approval.
- name: Favorites
  description: Foods saved by the logged-in user.
